name: dixtrie
# PRODUCTION (VPS):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Two separate containers: backend + mongo.
#  - Mongo has authentication on and is bound to 127.0.0.1 only (loopback) —
#    reachable from the VPS itself (e.g. an SSH tunnel), never from the
#    internet. The backend reaches it over the private compose network.
#  - The backend is published on host port 3100; Nginx Proxy Manager (already on
#    the VPS) forwards api-test.dixtri.com -> <vps-ip>:3100 and handles HTTPS.
services:
  mongo:
    image: mongo:7
    container_name: dixtrie-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env.prod}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env.prod}
    volumes:
      - mongo_data:/data/db
    ports:
      # Host port 27017 is already taken by another project on this VPS, so
      # this one is published on 27018 instead (loopback-only either way).
      - "127.0.0.1:27018:27017"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: dixtrie-backend
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-v1}
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-multicompany_commerce}?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env.prod}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env.prod}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      OTP_CODE_TTL_SECONDS: ${OTP_CODE_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dixtriv2-one.vercel.app}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env.prod}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Dixtri <no-reply@dixtri.com>}
      # File storage (S3-compatible). Optional: while S3_ENDPOINT is empty,
      # uploads answer 503 and everything else works normally.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-dixtri}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api-test.dixtri.com}
    ports:
      - "3100:3000"
    networks:
      - internal

networks:
  internal:

volumes:
  mongo_data:
